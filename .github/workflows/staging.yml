name: Staging Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - stage

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: octabyte-nithin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Tests
        run: pytest || echo "No tests to run or tests failed, continuing for staging deploy"

      - name: Trivy filesystem scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=octa
            -Dsonar.projectName=octa
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG_SHA="sha-${{ github.sha }}"
          TAG_STAGING="staging-${SHORT_SHA}"

          docker buildx build \
            --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache \
            --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache,mode=max \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_SHA \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_STAGING \
            --push \
            ./web

          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPOSITORY --image-ids imageTag=$TAG_SHA --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Trivy image scan (fail on HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@master
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          image-ref: '${{ env.IMAGE_URI }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Deploy to staging via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=OctaByte-Nithin" "Key=tag:Environment,Values=staging" \
            --parameters "{\"commands\":[\"sudo /opt/octabyte-nithin/bin/deploy-staging.sh ${{ env.IMAGE_URI }}\"]}" \
            --query "Command.CommandId" \
            --output text)
          sleep 5
          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          fi

      - name: Health check against staging
        run: |
          STAGING_URL="${{ vars.STAGING_BASE_URL }}"
          if [ -z "$STAGING_URL" ]; then
            STAGING_URL=$(aws ssm get-parameter --name "/octabyte-nithin/staging/alb-url" --query "Parameter.Value" --output text || echo "")
          fi
          curl --fail "http://$STAGING_URL/health"

      - name: Mark release as candidate
        if: success()
        run: |
          aws ssm put-parameter \
            --name "/octabyte-nithin/releases/candidate/image-uri" \
            --value "${{ env.IMAGE_URI }}" \
            --type String \
            --overwrite

      - name: Send Slack Notification
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Staging Pipeline finished with status: ${{ job.status }}. \nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
