name: Staging Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - stage

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: octabyte-nithin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python and restore cache
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Run Tests
        run: |
          if [ -f web/requirements.txt ]; then pip install -r web/requirements.txt; fi
          pip install pytest

          set +e
          cd web && pytest
          EXIT_CODE=$?
          set -e

          # pytest exit codes: 0 = all passed, 5 = no tests collected
          if [ "$EXIT_CODE" -eq 0 ] || [ "$EXIT_CODE" -eq 5 ]; then
            echo "Tests passed or no tests found."
            exit 0
          else
            echo "Tests failed."
            exit "$EXIT_CODE"
          fi

      - name: Trivy filesystem scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=octa
            -Dsonar.projectName=octa
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Build and Push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG_SHA="sha-${{ github.sha }}"
          TAG_STAGING="staging-${SHORT_SHA}"

          docker buildx build \
            --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache \
            --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache,mode=max \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_SHA \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_STAGING \
            --push \
            ./web

          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPOSITORY --image-ids imageTag=$TAG_SHA --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Trivy image scan (fail on HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          image-ref: '${{ env.IMAGE_URI }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Deploy to staging via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=OctaByte-Nithin" "Key=tag:Environment,Values=staging" \
            --parameters "{\"commands\":[\"sudo /opt/octabyte-nithin/bin/deploy-staging.sh ${{ env.IMAGE_URI }}\"]}" \
            --query "Command.CommandId" \
            --output text)
          sleep 5
          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          fi

      - name: Health check against staging
        run: |
          STAGING_URL="${{ vars.STAGING_BASE_URL }}"
          if [ -z "$STAGING_URL" ]; then
            STAGING_URL=$(aws ssm get-parameter --name "/octabyte-nithin/staging/alb-url" --query "Parameter.Value" --output text || echo "")
          fi
          for i in $(seq 1 10); do
            if curl --fail -s "http://$STAGING_URL/health"; then exit 0; fi
            sleep 6
          done
          echo "Health check failed after retries" && exit 1

      - name: Mark release as candidate
        if: success()
        run: |
          aws ssm put-parameter \
            --name "/octabyte-nithin/releases/candidate/image-uri" \
            --value "${{ env.IMAGE_URI }}" \
            --type String \
            --overwrite

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Staging Pipeline finished with status: $STATUS.\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
