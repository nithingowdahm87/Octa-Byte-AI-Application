name: Staging Pipeline

on:
  push:
    branches:
      - stage

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: octabyte-nithin
  ROLE_TO_ASSUME: arn:aws:iam::123456789012:role/github-actions-role

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          
          # Get the immutable image digest
          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPOSITORY --image-ids imageTag=${{ github.sha }} --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          
      - name: Store release image URI in SSM
        run: |
          aws ssm put-parameter \
            --name "/octabyte-nithin/staging/releases/${{ github.sha }}/image-uri" \
            --value "${{ env.IMAGE_URI }}" \
            --type SecureString \
            --overwrite

      - name: Deploy to staging via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Environment,Values=staging" \
            --parameters '{"commands":["/opt/octabyte-nithin/bin/deploy.sh ${{ env.IMAGE_URI }}"]}' \
            --query "Command.CommandId" \
            --output text)
          
          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          fi

      - name: Smoke test against staging ALB
        run: |
          STAGING_URL=$(aws ssm get-parameter --name "/octabyte-nithin/staging/alb-url" --query "Parameter.Value" --output text)
          curl -f "http://$STAGING_URL" || exit 1

      - name: Mark release as candidate
        if: success()
        run: |
          aws ssm put-parameter \
            --name "/octabyte-nithin/releases/candidate/image-uri" \
            --value "${{ env.IMAGE_URI }}" \
            --type String \
            --overwrite

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "Staging Pipeline: ${{ job.status }} for commit ${{ github.sha }}"
            }
