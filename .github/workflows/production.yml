name: Production Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run OWASP ZAP against staging
        run: |
          STAGING_URL=$(aws ssm get-parameter --name "/octabyte-nithin/staging/alb-url" --query "Parameter.Value" --output text)
          docker run -t owasp/zap2docker-stable zap-baseline.py -t "http://$STAGING_URL"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "PR Tests: ${{ job.status }} for PR ${{ github.event.pull_request.number }}"
            }

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read candidate image URI
        id: read-candidate
        run: |
          IMAGE_URI=$(aws ssm get-parameter --name "/octabyte-nithin/releases/candidate/image-uri" --query "Parameter.Value" --output text)
          if [[ "$IMAGE_URI" != *"@sha256:"* ]]; then
            echo "Error: Image URI does not contain a digest (@sha256:)"
            exit 1
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Determine slots
        id: slots
        run: |
          ACTIVE_SLOT=$(aws ssm get-parameter --name "/octabyte-nithin/production/active-slot" --query "Parameter.Value" --output text)
          if [ "$ACTIVE_SLOT" == "blue" ]; then
            INACTIVE_SLOT="green"
          else
            INACTIVE_SLOT="blue"
          fi
          echo "ACTIVE_SLOT=$ACTIVE_SLOT" >> $GITHUB_ENV
          echo "INACTIVE_SLOT=$INACTIVE_SLOT" >> $GITHUB_ENV

      - name: Deploy to inactive slot ASG via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Slot,Values=${{ env.INACTIVE_SLOT }}" \
            --parameters '{"commands":["/opt/octabyte-nithin/bin/deploy.sh ${{ env.IMAGE_URI }}"]}' \
            --query "Command.CommandId" \
            --output text)
          
          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          fi

      - name: Set deployment state to CANARY_IN_PROGRESS
        run: |
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "CANARY_IN_PROGRESS" --type String --overwrite

      - name: Shift ALB weights to 50/50
        run: |
          aws lambda invoke --function-name "release-controller" --payload '{"action":"shift","weights":{"blue":50,"green":50}}' response.json

      - name: Wait and Check CloudWatch Alarms
        run: |
          echo "Waiting for 5 minutes for canary evaluation..."
          sleep 300
          
          ALARM_STATE=$(aws cloudwatch describe-alarms --alarm-names "Production-Composite-Alarm" --query "CompositeAlarms[0].StateValue" --output text)
          
          if [ "$ALARM_STATE" == "ALARM" ]; then
            echo "Alarm triggered during canary! Rolling back."
            exit 1
          fi
          echo "Canary evaluation successful."

      - name: Finalize deployment (Success)
        if: success()
        run: |
          aws lambda invoke --function-name "release-controller" --payload '{"action":"shift","weights":{"${{ env.INACTIVE_SLOT }}":100,"${{ env.ACTIVE_SLOT }}":0}}' response.json
          aws ssm put-parameter --name "/octabyte-nithin/production/active-slot" --value "${{ env.INACTIVE_SLOT }}" --type String --overwrite
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "SUCCEEDED" --type String --overwrite

      - name: Rollback deployment (Failure)
        if: failure()
        run: |
          aws lambda invoke --function-name "release-controller" --payload '{"action":"shift","weights":{"${{ env.ACTIVE_SLOT }}":100,"${{ env.INACTIVE_SLOT }}":0}}' response.json
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "ROLLED_BACK" --type String --overwrite

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "Production Pipeline: ${{ job.status }} for commit ${{ github.sha }}"
            }
