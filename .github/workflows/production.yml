name: Production Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Integration tests
        run: echo "Running Integration Tests..." && make test-integration

      - name: QA Checks
        run: echo "Running QA checks..." && make qa-checks

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#octa-byte-ai",
              "text": "PR checks for production: ${{ job.status }}"
            }

  production-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: application
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Detect active color in SSM
        id: detect-color
        run: |
          ACTIVE_COLOR=$(aws ssm get-parameter --name "/app/active_color" --query "Parameter.Value" --output text || echo "blue")
          if [ "$ACTIVE_COLOR" == "blue" ]; then
            echo "IDLE_COLOR=green" >> $GITHUB_ENV
          else
            echo "IDLE_COLOR=blue" >> $GITHUB_ENV
          fi

      - name: Deploy to idle ASG
        run: |
          echo "Deploying to ASG app-asg-${{ env.IDLE_COLOR }}"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "app-asg-${{ env.IDLE_COLOR }}" \
            --preferences '{"MinHealthyPercentage": 90, "InstanceWarmup": 300}'
          # Wait for ASG instance refresh
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "app-asg-${{ env.IDLE_COLOR }}" --query 'InstanceRefreshes[0].Status' --output text)
            if [ "$STATUS" == "Successful" ]; then break; fi
            if [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then exit 1; fi
            sleep 30
          done

      - name: TF switch ALB to 50/50
        run: |
          echo "Switching traffic to 50/50..."
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions '[{"Type":"forward","ForwardConfig":{"TargetGroups":[{"TargetGroupArn":"${{ secrets.TG_BLUE_ARN }}","Weight":50},{"TargetGroupArn":"${{ secrets.TG_GREEN_ARN }}","Weight":50}]}}]'

      - name: 5-min CloudWatch wait loop using AWS CLI polling
        run: |
          echo "Waiting for 5 minutes and monitoring errors..."
          END_TIME=$(date -d "5 minutes" +%s)
          while [ $(date +%s) -lt $END_TIME ]; do
            ERRORS=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/ApplicationELB \
              --metric-name HTTPCode_Target_5XX_Count \
              --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
              --period 300 --statistics Sum --query 'Datapoints[0].Sum' --output text)
            if [ "$ERRORS" != "None" ] && [ "$ERRORS" != "" ]; then
              ERROR_INT=${ERRORS%.*}
              if [ "$ERROR_INT" -gt 10 ]; then
                echo "Error rate too high, aborting canary"
                exit 1
              fi
            fi
            sleep 30
          done

      - name: Finalize 100/0 or rollback
        if: always()
        run: |
          if [ "${{ job.status }}" == "Success" ]; then
            echo "Finalizing deployment to 100% on ${{ env.IDLE_COLOR }}"
            aws ssm put-parameter --name "/app/active_color" --value "${{ env.IDLE_COLOR }}" --type String --overwrite
            aws elbv2 modify-listener \
              --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
              --default-actions '[{"Type":"forward","TargetGroupArn":"${{ secrets.TG_'${{ env.IDLE_COLOR }}'_ARN }}"}]'
          else
            echo "Rolling back to active color"
            ACTIVE_COLOR=$(aws ssm get-parameter --name "/app/active_color" --query "Parameter.Value" --output text)
            aws elbv2 modify-listener \
              --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
              --default-actions '[{"Type":"forward","TargetGroupArn":"${{ secrets.TG_'${ACTIVE_COLOR}'_ARN }}"}]'
          fi

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#octa-byte-ai",
              "text": "Production deployment status: ${{ job.status }}"
            }

