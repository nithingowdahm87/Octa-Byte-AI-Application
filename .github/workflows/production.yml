name: Production Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run OWASP ZAP against staging
        run: |
          STAGING_URL=$(aws ssm get-parameter --name "/octabyte-nithin/staging/alb-url" --query "Parameter.Value" --output text)
          docker run -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "http://$STAGING_URL" -I

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"PR Tests: $STATUS for PR ${{ github.event.pull_request.number }}.\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read candidate image URI
        id: read-candidate
        run: |
          IMAGE_URI=$(aws ssm get-parameter --name "/octabyte-nithin/releases/candidate/image-uri" --query "Parameter.Value" --output text)
          if [[ "$IMAGE_URI" != *"@sha256:"* ]]; then
            echo "Error: Image URI does not contain a digest (@sha256:)"
            exit 1
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Determine slots
        id: slots
        run: |
          ACTIVE_SLOT=$(aws ssm get-parameter --name "/octabyte-nithin/production/active-slot" --query "Parameter.Value" --output text)
          if [ "$ACTIVE_SLOT" == "blue" ]; then
            INACTIVE_SLOT="green"
          else
            INACTIVE_SLOT="blue"
          fi
          echo "ACTIVE_SLOT=$ACTIVE_SLOT" >> $GITHUB_ENV
          echo "INACTIVE_SLOT=$INACTIVE_SLOT" >> $GITHUB_ENV

      - name: Deploy to inactive slot ASG via SSM
        run: |
          echo "Waiting for SSM agent to be online..."
          for i in {1..30}; do
            INSTANCE_ID=$(aws ssm describe-instance-information --filters "Key=tag:Environment,Values=production" "Key=tag:Slot,Values=${{ env.INACTIVE_SLOT }}" --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' --output text | awk '{print $1}')
            if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
              echo "Found online instance: $INSTANCE_ID"
              break
            fi
            echo "Waiting..."
            sleep 10
          done

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "Error: No online SSM instances found for deployment in slot ${{ env.INACTIVE_SLOT }}"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$INSTANCE_ID" \
            --parameters "{\"commands\":[\"/opt/octabyte-nithin/bin/deploy.sh ${{ env.IMAGE_URI }}\"]}" \
            --query "Command.CommandId" \
            --output text)
          
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Set deployment state to CANARY_IN_PROGRESS
        run: |
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "CANARY_IN_PROGRESS" --type String --overwrite

      - name: Shift ALB weights to 50/50
        run: |
          aws lambda invoke --function-name "octabyte-nithin-production-release-controller" --cli-binary-format raw-in-base64-out --payload '{"action":"shift","weights":{"blue":50,"green":50}}' response.json

      - name: Wait and Check CloudWatch Alarms
        run: |
          echo "Waiting for 5 minutes for canary evaluation..."
          sleep 300

          ALARM_STATE=$(aws cloudwatch describe-alarms --alarm-names "octabyte-nithin-production-canary-rollback" --query "CompositeAlarms[0].StateValue" --output text)

          if [ "$ALARM_STATE" == "ALARM" ]; then
            echo "Alarm triggered during canary! Rolling back."
            exit 1
          fi
          echo "Canary evaluation successful. Alarm state: $ALARM_STATE"

      - name: Finalize deployment (Success)
        if: success()
        run: |
          aws lambda invoke --function-name "octabyte-nithin-production-release-controller" --cli-binary-format raw-in-base64-out --payload '{"action":"shift","weights":{"${{ env.INACTIVE_SLOT }}":100,"${{ env.ACTIVE_SLOT }}":0}}' response.json
          aws ssm put-parameter --name "/octabyte-nithin/production/active-slot" --value "${{ env.INACTIVE_SLOT }}" --type String --overwrite
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "SUCCEEDED" --type String --overwrite

      - name: Rollback deployment (Failure)
        if: failure()
        run: |
          aws lambda invoke --function-name "octabyte-nithin-production-release-controller" --cli-binary-format raw-in-base64-out --payload '{"action":"shift","weights":{"${{ env.ACTIVE_SLOT }}":100,"${{ env.INACTIVE_SLOT }}":0}}' response.json
          aws ssm put-parameter --name "/octabyte-nithin/production/deployment-state" --value "ROLLED_BACK" --type String --overwrite

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Production Pipeline: $STATUS for commit ${{ github.sha }}.\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
